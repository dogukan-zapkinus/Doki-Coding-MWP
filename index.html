<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doki Coding - Learn Python</title>
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS & Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: { primary: '#6366f1', darkbg: '#0f172a', darkcard: '#1e293b' }
                }
            }
        }
    </script>

    <style>
        /* Gelişmiş Animasyonlar */
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .option-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .option-btn:hover:not(:disabled) { transform: translateY(-4px) scale(1.02); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .option-btn:active:not(:disabled) { transform: translateY(2px) scale(0.98); }
        
        #action-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #action-btn:active:not(:disabled) { transform: scale(0.95); }
    </style>
</head>
<!-- Pre-load script for theme to prevent flicker -->
<script>
    if (localStorage.getItem("dokicoding_theme") === "dark" || (!localStorage.getItem("dokicoding_theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
    }
</script>
<body class="bg-slate-50 dark:bg-darkbg text-slate-800 dark:text-slate-100 min-h-screen flex flex-col selection:bg-indigo-200 transition-colors duration-300">
    
    <!-- Navbar -->
    <nav class="w-full bg-white dark:bg-darkcard shadow-sm p-4 flex justify-between items-center z-10 border-b border-slate-100 dark:border-slate-800 transition-colors duration-300">
        <div class="text-3xl font-black text-indigo-500 tracking-tight flex items-center gap-2" id="app-title">
            <span class="text-4xl">🚀</span> Doki Coding
        </div>
        <div class="flex gap-3">
            <button id="theme-toggle" class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 p-3 rounded-2xl font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95">
                🌙
            </button>
            <button id="lang-toggle" class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-5 py-3 rounded-2xl font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition active:scale-95">
                TR / EN
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-start pt-8 px-4 md:px-0">
        
        <!-- Progress -->
        <div class="w-full max-w-3xl mb-8 hidden slide-up" id="progress-container">
            <div class="flex justify-between mb-3 px-2">
                <span class="text-sm font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest" id="progress-text">Progress</span>
                <span class="text-sm font-extrabold text-indigo-500" id="progress-percentage">0%</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-5 p-1 shadow-inner">
                <div class="bg-gradient-to-r from-indigo-400 to-indigo-600 h-full rounded-full transition-all duration-700 ease-out shadow-sm" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Render Area -->
        <div class="w-full max-w-3xl bg-white dark:bg-darkcard rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.2)] p-8 md:p-12 border border-slate-100 dark:border-slate-800 slide-up transition-colors duration-300" id="content-area">
        </div>

    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
